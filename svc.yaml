apiVersion: v1
kind: Service
metadata:
  name: weather-service-blue
  labels:
    app: weather
    version: blue
spec:
  type: NodePort
  selector:
    app: weather
    version: blue
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30001
      protocol: TCP

